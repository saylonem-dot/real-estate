<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Access | Emmanuel Real Estate CRM Portal</title>
  <meta name="description" content="Secure private access portal for Emmanuel Real Estate directors and advisory partners.">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 20%, #262626 0%, #141414 100%);
      color: #F7F5F2;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
    }

    .login-wrapper::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=2000&q=80');
      background-size: cover;
      background-position: center;
      opacity: 0.12;
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: rgba(26, 26, 26, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(184, 151, 90, 0.35);
      padding: 3.5rem 3rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .login-card .brand-logo {
      display: inline-block;
      margin-bottom: 2rem;
      text-align: center;
      width: 100%;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 0.5rem;
      color: #FFFFFF;
    }

    .login-subtitle {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--color-gold);
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .login-form .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .login-form label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #A3A3A3;
      margin-bottom: 0.5rem;
    }

    .login-form input {
      width: 100%;
      background: rgba(15, 15, 15, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      padding: 0.95rem 1.15rem;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .login-form input:focus {
      border-color: var(--color-gold);
      background: rgba(20, 20, 20, 0.95);
      box-shadow: 0 0 15px rgba(184, 151, 90, 0.2);
    }

    .btn-login {
      width: 100%;
      background: var(--color-gold);
      color: #1A1A1A;
      font-weight: 600;
      letter-spacing: 0.2em;
      border: none;
      padding: 1.1rem;
      margin-top: 1rem;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-login:hover {
      background: #C8A86B;
      color: #000000;
      transform: translateY(-1px);
    }

    .login-error {
      display: none;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.4);
      color: #FCA5A5;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .demo-accounts {
      margin-top: 2.25rem;
      padding-top: 1.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .demo-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #888888;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .demo-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #D1D5DB;
      font-size: 0.7rem;
      padding: 0.6rem 0.75rem;
      text-align: left;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .demo-btn strong {
      display: block;
      color: var(--color-gold);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .demo-btn:hover {
      background: rgba(184, 151, 90, 0.12);
      border-color: var(--color-gold);
      color: #FFFFFF;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888888;
      transition: var(--transition-smooth);
    }

    .back-home:hover {
      color: var(--color-gold);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <a href="./" class="brand-logo logo-white" aria-label="Emmanuel Real Estate">
        <div class="logo-text">
          <span class="logo-title" style="font-size: 2.2rem;">Emman</span>
          <span class="logo-divider" style="background-color: var(--color-gold);"></span>
          <span class="logo-subtitle" style="font-size: 0.65rem; color: #D1D5DB;">REAL ESTATE</span>
        </div>
      </a>

      <h1 class="login-title">Executive Access</h1>
      <p class="login-subtitle">Private CRM & Lead Desk</p>

      <div id="login-error" class="login-error" role="alert"></div>

      <form id="admin-login-form" class="login-form">
        <div class="form-group">
          <label for="email">Corporate Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@emmanuelrealestate.ae">
        </div>

        <div class="form-group">
          <label for="password">Security Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-login">
          Sign In to Portal
        </button>
      </form>

      <!-- Quick Demo Access for Testing -->
      <div class="demo-accounts">
        <div class="demo-title">
          <span>Quick Select Credentials:</span>
          <span style="color: var(--color-gold);">Click to Fill</span>
        </div>
        <div class="demo-grid">
          <button type="button" class="demo-btn" onclick="fillCreds('admin@emmanuelrealestate.ae', 'EmmanuelLuxury2026!')">
            <strong>Director (Admin)</strong>
            <span>Full Agency Access</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillCreds('alexander@emmanuelrealestate.ae', 'agent123')">
            <strong>Alexander Wright</strong>
            <span>Senior Partner</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillCreds('elena@emmanuelrealestate.ae', 'agent123')">
            <strong>Elena Rostova</strong>
            <span>Private Client Partner</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillCreds('tariq@emmanuelrealestate.ae', 'agent123')">
            <strong>Tariq Al-Mansoor</strong>
            <span>Associate Director</span>
          </button>
        </div>
      </div>

      <a href="./" class="back-home">← Return to Public Portfolio</a>
    </div>
  </div>

  <script>
    function fillCreds(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('login-error').style.display = 'none';
    }

    document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('login-error');
      const submitBtn = document.getElementById('btn-submit');

      errorDiv.style.display = 'none';
      submitBtn.textContent = 'Verifying Credentials...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Authentication failed. Please verify credentials.');
        }

        // Store user session in localStorage
        localStorage.setItem('emmanuel_admin_user', JSON.stringify(data.user));
        localStorage.setItem('jay_admin_user', JSON.stringify(data.user));

        // Redirect to CRM Area
        window.location.href = './admin.html';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
        submitBtn.textContent = 'Sign In to Portal';
        submitBtn.disabled = false;
      }
    });

    // Auto-check if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const existingUser = localStorage.getItem('emmanuel_admin_user') || localStorage.getItem('jay_admin_user');
      if (existingUser) {
        try {
          const user = JSON.parse(existingUser);
          if (user && user.email) {
            // Pre-fill email
            document.getElementById('email').value = user.email;
          }
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
